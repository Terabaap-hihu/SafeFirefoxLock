name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Valid Android XML
        run: |
          python3 -c '
          NS = "{http://android.com}"
          import xml.etree.ElementTree as ET
          ET.register_namespace("android", "http://android.com")

          m = ET.Element("manifest")
          app = ET.SubElement(m, "application", {NS+"allowBackup":"false", NS+"label":"SafeFirefoxLock", NS+"theme":"@style/Theme.AppCompat.NoActionBar"})
          
          act = ET.SubElement(app, "activity", {NS+"name":".MainActivity", NS+"exported":"true", NS+"launchMode":"singleTask", NS+"excludeFromRecents":"true"})
          f1 = ET.SubElement(act, "intent-filter")
          ET.SubElement(f1, "action", {NS+"name":"android.intent.action.MAIN"})
          ET.SubElement(f1, "category", {NS+"name":"android.intent.category.LAUNCHER"})
          
          f2 = ET.SubElement(act, "intent-filter")
          ET.SubElement(f2, "action", {NS+"name":"android.intent.action.VIEW"})
          ET.SubElement(f2, "category", {NS+"name":"android.intent.category.DEFAULT"})
          ET.SubElement(f2, "category", {NS+"name":"android.intent.category.BROWSABLE"})
          ET.SubElement(f2, "data", {NS+"scheme":"safelock", NS+"host":"trigger120"})

          srv = ET.SubElement(app, "service", {NS+"name":".BrowserGuardService", NS+"permission":"android.permission.BIND_ACCESSIBILITY_SERVICE", NS+"exported":"true"})
          f3 = ET.SubElement(srv, "intent-filter")
          ET.SubElement(f3, "action", {NS+"name":"android.accessibilityservice.AccessibilityService"})
          ET.SubElement(srv, "meta-data", {NS+"name":"android.accessibilityservice", NS+"resource":"@xml/service_config"})

          ET.ElementTree(m).write("app/src/main/AndroidManifest.xml", encoding="utf-8", xml_declaration=True)

          s = ET.Element("accessibility-service", {NS+"accessibilityEventTypes":"typeWindowStateChanged", NS+"accessibilityFeedbackType":"feedbackGeneric", NS+"canRetrieveWindowContent":"false", NS+"notificationTimeout":"100"})
          ET.ElementTree(s).write("app/src/main/res/xml/service_config.xml", encoding="utf-8", xml_declaration=True)
          '

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SafeFirefoxLock-APK
          path: app/build/outputs/apk/debug/app-debug.apk
